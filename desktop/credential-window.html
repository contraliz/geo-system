<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configure Live writing agent</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #172235; background: #f7f9fc; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 30px; }
    main { max-width: 520px; margin: 0 auto; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { color: #607087; font-size: 13px; line-height: 1.5; }
    label { display: block; margin: 24px 0 7px; color: #43536b; font-size: 12px; font-weight: 600; }
    input { width: 100%; height: 40px; padding: 0 11px; color: #172235; background: #fff; border: 1px solid #b9c5d6; border-radius: 6px; font: 14px ui-monospace, SFMono-Regular, Consolas, monospace; }
    input:focus { outline: 2px solid #5571de; outline-offset: 1px; }
    .error { min-height: 20px; margin: 8px 0 0; color: #b43c4b; font-size: 12px; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    button { min-width: 90px; height: 36px; padding: 0 13px; border: 1px solid #b9c5d6; border-radius: 6px; font: 600 12px system-ui, sans-serif; cursor: pointer; }
    button[type="submit"] { color: #fff; background: #4562d5; border-color: #4562d5; }
    button:disabled { cursor: wait; opacity: .65; }
    .note { margin-top: 22px; padding: 11px 12px; color: #53647d; background: #eaf0ff; border-radius: 6px; font-size: 12px; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Configure Live writing agent</h1>
    <p id="description">Enter the MiniMax M3 API key used by the local Anthropic-compatible proxy. The key is encrypted and stored only on this desktop.</p>
    <form id="credential-form" novalidate>
      <label id="key-label" for="api-key">MiniMax API key</label>
      <input id="api-key" name="apiKey" type="password" autocomplete="off" spellcheck="false" autofocus maxlength="512" aria-describedby="security-note">
      <p id="error" class="error" role="alert" aria-live="polite"></p>
      <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="save" type="submit">Save key</button>
      </div>
    </form>
    <div id="security-note" class="note">The main GEO workspace never receives the key. It is used only by the local desktop proxy.</div>
  </main>
  <script>
    const language = new URLSearchParams(location.search).get('language') === 'zh' ? 'zh' : 'en'
    const copy = language === 'zh' ? {
      title: '配置实时写作代理', description: '输入本地 Anthropic 兼容代理使用的 MiniMax M3 API 密钥。密钥会加密后仅保存在此桌面应用中。', keyLabel: 'MiniMax API 密钥', cancel: '取消', save: '保存密钥', required: '请输入 API 密钥。', failed: '无法保存 API 密钥，请重试。', security: 'GEO 主工作区不会接收密钥。密钥仅由本地桌面代理使用。'
    } : {
      title: 'Configure Live writing agent', description: 'Enter the MiniMax M3 API key used by the local Anthropic-compatible proxy. The key is encrypted and stored only on this desktop.', keyLabel: 'MiniMax API key', cancel: 'Cancel', save: 'Save key', required: 'Enter an API key.', failed: 'The API key could not be saved. Try again.', security: 'The main GEO workspace never receives the key. It is used only by the local desktop proxy.'
    }
    document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en'
    document.querySelector('#title').textContent = copy.title
    document.querySelector('#description').textContent = copy.description
    document.querySelector('#key-label').textContent = copy.keyLabel
    document.querySelector('#cancel').textContent = copy.cancel
    document.querySelector('#save').textContent = copy.save
    document.querySelector('#security-note').textContent = copy.security
    const form = document.querySelector('#credential-form')
    const input = document.querySelector('#api-key')
    const error = document.querySelector('#error')
    const save = document.querySelector('#save')
    const cancel = document.querySelector('#cancel')
    form.addEventListener('submit', async event => {
      event.preventDefault()
      error.textContent = ''
      if (!input.value.trim()) { error.textContent = copy.required; input.focus(); return }
      save.disabled = true
      cancel.disabled = true
      const result = await window.credentialApi.saveApiKey(input.value).catch(() => ({ ok: false, error: copy.failed }))
      if (!result?.ok) {
        error.textContent = result?.error || copy.failed
        save.disabled = false
        cancel.disabled = false
        input.focus()
      }
    })
    cancel.addEventListener('click', () => { void window.credentialApi.cancel() })
    input.focus()
  </script>
</body>
</html>
